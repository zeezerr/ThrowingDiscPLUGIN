name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Build plugin
        run: gradle build
      - name: Zip resource pack
        working-directory: resourcepack
        run: zip -r ../ThrowingDisc-ResourcePack.zip pack.mcmeta assets
      - uses: actions/upload-artifact@v4
        with:
          name: throwing-disc-paper
          path: |
            build/libs/*.jar
            ThrowingDisc-ResourcePack.zip
