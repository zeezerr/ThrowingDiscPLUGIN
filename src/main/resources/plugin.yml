name: ThrowingDisc
version: '${version}'
main: com.example.throwingdisc.ThrowingDiscPlugin
api-version: '1.21.11'
description: Tiered boomerang-style throwing discs.
commands:
  throwingdisc:
    description: Throwing disc admin command
    usage: /throwingdisc config | /throwingdisc give <tier> [player]
    aliases: [tdisc]
permissions:
  throwingdisc.give:
    description: Allows /throwingdisc give
    default: op
  throwingdisc.config:
    description: Allows /throwingdisc config (settings GUI)
    default: op
