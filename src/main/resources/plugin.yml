name: ThrowingDisc
version: '${version}'
main: com.example.throwingdisc.ThrowingDiscPlugin
api-version: '1.21.11'
description: Tiered boomerang-style throwing discs.
commands:
  throwingdisc:
    description: Give yourself a throwing disc
    usage: /throwingdisc give <tier> [player]
    aliases: [tdisc]
    permission: throwingdisc.give
permissions:
  throwingdisc.give:
    description: Allows /throwingdisc give
    default: op
